
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .login {
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
        }

        legend {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 17px;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Student Exam Performance Indicator</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <fieldset>
                <legend>Student Exam Performance Prediction</legend>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label" for="gender">Gender</label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="" selected disabled>Select your Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <!-- Race or Ethnicity -->
                <div class="mb-3">
                    <label class="form-label" for="ethnicity">
                        Race or Ethnicity
                    </label>
                    <select class="form-select" id="ethnicity" name="ethnicity" required>
                        <option value="" selected disabled>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <!-- Parental Education -->
                <div class="mb-3">
                    <label class="form-label" for="parental_level_of_education">
                        Parental Level of Education
                    </label>
                    <select
                        class="form-select"
                        id="parental_level_of_education"
                        name="parental_level_of_education"
                        required
                    >
                        <option value="" selected disabled>
                            Select Parent Education
                        </option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>

                <!-- Lunch -->
                <div class="mb-3">
                    <label class="form-label" for="lunch">Lunch Type</label>
                    <select class="form-select" id="lunch" name="lunch" required>
                        <option value="" selected disabled>Select Lunch Type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <!-- Test Preparation -->
                <div class="mb-3">
                    <label class="form-label" for="test_preparation_course">
                        Test Preparation Course
                    </label>
                    <select
                        class="form-select"
                        id="test_preparation_course"
                        name="test_preparation_course"
                        required
                    >
                        <option value="" selected disabled>
                            Select Test Preparation Course
                        </option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <!-- Reading Score -->
                <div class="mb-3">
                    <label class="form-label" for="reading_score">
                        Reading Score out of 100
                    </label>
                    <input
                        class="form-control"
                        type="number"
                        id="reading_score"
                        name="reading_score"
                        placeholder="Enter your Reading Score"
                        min="0"
                        max="100"
                        step="1"
                        required
                    >
                </div>

                <!-- Writing Score -->
                <div class="mb-3">
                    <label class="form-label" for="writing_score">
                        Writing Score out of 100
                    </label>
                    <input
                        class="form-control"
                        type="number"
                        id="writing_score"
                        name="writing_score"
                        placeholder="Enter your Writing Score"
                        min="0"
                        max="100"
                        step="1"
                        required
                    >
                </div>

                <!-- Submit Button -->
                <div class="mb-3">
                    <button class="btn btn-primary" type="submit">
                        Predict Maths Score
                    </button>
                </div>

            </fieldset>
        </form>

        <!-- Prediction Result -->
        {% if results is defined and results is not none %}
        <div class="result">
            <h2>Prediction Result</h2>
            <p>Predicted Maths Score: {{ results }}</p>
        </div>
        {% endif %}

    </div>

</body>
</html>
